<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8f6bff" />
  <title>Sudoku Fun</title>
  <meta name="description" content="A colorful sudoku game for kids with Mini 6×6 and Classic 9×9 boards." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="float f1">⭐</span>
    <span class="float f2">🎈</span>
    <span class="float f3">✨</span>
    <span class="float f4">🌈</span>
    <span class="float f5">🍭</span>
    <span class="float f6">☁️</span>
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <!-- Start screen -->
  <section id="home" class="screen home">
    <h1 class="logo" aria-label="Sudoku Fun">
      <span class="logo-word" id="logo"></span>
    </h1>
    <p class="tagline">Fill every row, column and box with each number once!</p>

    <button id="continue" class="continue" hidden>
      <span class="continue-icon">▶</span>
      <span>
        <strong>Continue</strong>
        <small id="continue-label"></small>
      </span>
    </button>

    <h2 class="step"><span class="step-num">1</span> Pick a board</h2>
    <div class="modes" role="radiogroup" aria-label="Board size">
      <button class="mode-card" data-mode="mini" role="radio">
        <span class="preview" data-preview="mini"></span>
        <span class="mode-name">Mini</span>
        <span class="mode-sub">6 × 6 · numbers 1–6</span>
      </button>
      <button class="mode-card" data-mode="classic" role="radio">
        <span class="preview" data-preview="classic"></span>
        <span class="mode-name">Classic</span>
        <span class="mode-sub">9 × 9 · numbers 1–9</span>
      </button>
    </div>

    <h2 class="step"><span class="step-num">2</span> Pick a level to start</h2>
    <div class="levels">
      <button class="level" data-level="easy"><span class="level-icon">🐣</span>Easy<small>★</small></button>
      <button class="level" data-level="medium"><span class="level-icon">🦊</span>Medium<small>★★</small></button>
      <button class="level" data-level="hard"><span class="level-icon">🦁</span>Hard<small>★★★</small></button>
    </div>
  </section>

  <!-- Game screen -->
  <section id="game" class="screen game" hidden>
    <header class="topbar">
      <button id="btn-home" class="round-btn" aria-label="Home">🏠</button>
      <div class="topbar-title">
        <span class="mini-logo">Sudoku Fun</span>
        <span id="chip" class="chip"></span>
      </div>
      <button id="btn-sound" class="round-btn" aria-label="Sound on">🔊</button>
    </header>

    <main class="play-area">
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
      </div>

      <div class="controls">
        <div id="pad" class="pad" aria-label="Numbers"></div>
        <div class="actions">
          <button id="btn-undo" class="tool" aria-label="Undo"><span class="tool-icon">↶</span><span class="tool-label">Undo</span></button>
          <button id="btn-erase" class="tool" aria-label="Erase"><span class="tool-icon">⌫</span><span class="tool-label">Erase</span></button>
          <button id="btn-hint" class="tool" aria-label="Hint"><span class="tool-icon">💡</span><span class="tool-label">Hint</span></button>
          <button id="btn-check" class="check-btn"><span class="check-icon">✓</span> Check</button>
        </div>
      </div>
    </main>
  </section>

  <!-- Win overlay -->
  <div id="win" class="overlay" hidden>
    <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="win-trophy">🏆</div>
      <h2 id="win-title">You did it!</h2>
      <div id="win-stars" class="win-stars"></div>
      <p id="win-info" class="win-info"></p>
      <div class="win-actions">
        <button id="btn-again" class="big-btn">🎲 New puzzle</button>
        <button id="btn-win-home" class="big-btn secondary">🏠 Change level</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <script src="js/sudoku.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
