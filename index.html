<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8f6bff" />
  <title>Sudoku Kul</title>
  <meta name="description" content="Ett färgglatt sudoku för barn med Mini 6×6 och Klassisk 9×9." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <!-- Start screen -->
  <section id="home" class="screen home">
    <h1 class="logo" aria-label="Sudoku Kul">
      <span class="logo-word" id="logo"></span>
    </h1>
    <p class="tagline">Fyll varje rad, kolumn och block – varje siffra bara en gång!</p>

    <button id="continue" class="continue" hidden>
      <span class="continue-icon">▶</span>
      <span>
        <strong>Fortsätt</strong>
        <small id="continue-label"></small>
      </span>
    </button>

    <h2 class="step"><span class="step-num">1</span> Vem spelar?</h2>
    <div id="players" class="players" role="radiogroup" aria-label="Spelare"></div>

    <h2 class="step"><span class="step-num">2</span> Välj bräde</h2>
    <div class="modes" role="radiogroup" aria-label="Brädets storlek">
      <button class="mode-card" data-mode="mini" role="radio">
        <span class="preview" data-preview="mini"></span>
        <span class="mode-name">Mini</span>
        <span class="mode-sub">6 × 6 · siffror 1–6</span>
      </button>
      <button class="mode-card" data-mode="classic" role="radio">
        <span class="preview" data-preview="classic"></span>
        <span class="mode-name">Klassisk</span>
        <span class="mode-sub">9 × 9 · siffror 1–9</span>
      </button>
    </div>

    <h2 class="step"><span class="step-num">3</span> Välj nivå och börja</h2>
    <div class="levels">
      <button class="level" data-level="easy"><span class="level-icon">🐣</span>Lätt<small>★</small></button>
      <button class="level" data-level="medium"><span class="level-icon">🦊</span>Mellan<small>★★</small></button>
      <button class="level" data-level="hard"><span class="level-icon">🦁</span>Svår<small>★★★</small></button>
    </div>

    <section class="leaderboard" aria-labelledby="lb-title">
      <div class="lb-head">
        <h2 id="lb-title" class="lb-title">🏆 Topplista</h2>
        <span id="lb-status" class="lb-status"></span>
      </div>
      <div class="lb-tabs" role="tablist">
        <button class="lb-tab" data-mode="mini" role="tab">Mini 6×6</button>
        <button class="lb-tab" data-mode="classic" role="tab">Klassisk 9×9</button>
      </div>
      <div id="lb-levels" class="lb-levels"></div>
    </section>
  </section>

  <!-- Game screen -->
  <section id="game" class="screen game" hidden>
    <header class="topbar">
      <button id="btn-home" class="round-btn" aria-label="Hem">🏠</button>
      <div class="topbar-title">
        <span class="timer" role="timer" aria-label="Tid">
          <span class="timer-icon">⏱</span><span id="timer-time">0:00</span>
          <span id="timer-best" class="timer-best" hidden></span>
        </span>
        <span id="chip" class="chip"></span>
      </div>
      <button id="btn-sound" class="round-btn" aria-label="Ljud på">🔊</button>
    </header>

    <main class="play-area">
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Sudokubräde"></div>
      </div>

      <div class="controls">
        <div class="pads">
          <div id="pad" class="pad" aria-label="Svar"></div>
          <div id="notes-pad" class="pad notes-pad" aria-label="Anteckningar"></div>
        </div>
        <div class="actions">
          <button id="btn-undo" class="tool" aria-label="Ångra"><span class="tool-icon">↶</span><span class="tool-label">Ångra</span></button>
          <button id="btn-erase" class="tool" aria-label="Sudda"><span class="tool-icon">⌫</span><span class="tool-label">Sudda</span></button>
          <button id="btn-hint" class="tool" aria-label="Ledtråd"><span class="tool-icon">💡</span><span class="tool-label">Ledtråd</span></button>
          <button id="btn-check" class="check-btn"><span class="check-icon">✓</span> Kolla</button>
        </div>
      </div>
    </main>
  </section>

  <!-- Win overlay -->
  <div id="win" class="overlay" hidden>
    <div class="win-card" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="win-trophy">🏆</div>
      <div id="win-banner" class="record-banner" hidden aria-label="Nytt rekord!"></div>
      <h2 id="win-title">Du klarade det!</h2>
      <p id="win-record-detail" class="record-detail" hidden></p>
      <p id="win-record" class="win-record" hidden></p>
      <div id="win-stars" class="win-stars"></div>
      <p id="win-info" class="win-info"></p>
      <div class="win-actions">
        <button id="btn-again" class="big-btn">🎲 Nytt pussel</button>
        <button id="btn-win-home" class="big-btn secondary">🏠 Byt nivå</button>
      </div>
    </div>
  </div>

  <!-- Avatar picker -->
  <div id="avatar-picker" class="overlay" hidden>
    <div class="picker-card" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <h2 id="picker-title">Välj din figur</h2>
      <div id="avatar-grid" class="avatar-grid" role="radiogroup" aria-label="Figurer"></div>
      <button id="picker-close" class="big-btn secondary">Stäng</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <script src="js/firebase-config.js"></script>
  <script src="js/sudoku.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
